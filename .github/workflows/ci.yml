# GPU-free gate on every push to main and every pull request.
#
# The suite is designed to pass without a GPU, the font corpus, model weights,
# potrace or a network: tests that need any of those skip, and `-rs` lists
# every skip so the public run's coverage is visible rather than assumed. The
# two tests that would download TrOCR and DINOv2 are held off with
# FONTGEN_NO_MODEL_DOWNLOADS so a pull request does not pull a gigabyte of
# weights per run. Anything that needs the 3090 -- training, the eval harness,
# the product loop -- is run and reported by hand, with the number's own noise
# stated (CLAUDE.md).
#
# Dependencies are installed from `>=` floors against the live index, so a
# dependency release can change the result with no change here. Known and
# accepted for a research repository; pin if it ever bites.
#
# Two jobs, three required checks: `tests (3.12)`, `tests (3.14)`,
# `public-audit`. Third-party actions are pinned to full commit SHAs, and the
# gitleaks binary to a checksum.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      FONTGEN_NO_MODEL_DOWNLOADS: "1"
      PYTHONUTF8: "1"
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU torch first (the CUDA wheels are 2 GB and useless here)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install the pipeline, the demo's UI library, and pytest
        run: pip install -r requirements.txt gradio pytest
      - name: Run the suite (skips listed)
        run: python -m pytest -q -rs -p no:cacheprovider

  # The same gate the release runbook runs before any visibility change
  # (docs/public-release.md): no home paths, pasted tool noise, machine names,
  # key-shaped strings, fonts, weights or archives in any tracked file -- and
  # gitleaks over the whole reachable history, because GitHub's own secret
  # scanning only starts once a repository is public, which is after exposure.
  public-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Sanitizer gate on the tracked tree
        run: python analysis/sanitize_for_publish.py --check
      - name: Install checksum-pinned gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan secrets across all reachable history
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact
          --max-decode-depth 2 --max-archive-depth 2 --log-opts="--all --full-history" .
